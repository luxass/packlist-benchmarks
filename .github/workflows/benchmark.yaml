name: update benchmarks

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ./bench/*.ts
      - ./scripts/update-readme.ts
      - ./.github/workflows/benchmark.yaml
      - ./package.json
      - ./pnpm-lock.yaml
  pull_request_target:
    types:
      - opened
      - synchronize
    paths:
      - ./bench/*.ts
      - ./scripts/update-readme.ts
      - ./.github/workflows/benchmark.yaml
      - ./package.json
      - ./pnpm-lock.yaml
  schedule:
    - cron: 0 0 * * 1

jobs:
  build:
    if: github.repository_owner == 'luxass'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install

      - name: Benchmark
        run: pnpm benchmark

      - name: update readme
        run: pnpm update-readme

      - name: readme contents
        id: readme
        run: |
          BENCH_RESULTS=$(sed -n '/<!-- bench:start -->/,/<!-- bench:end -->/{/<!-- bench:start -->/d; /<!-- bench:end -->/d; p;}' README.md)
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "BENCH_RESULTS<<$EOF" >> $GITHUB_OUTPUT
          echo "$BENCH_RESULTS" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: create pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          commit-message: "chore: update benchmarks"
          title: "chore: update benchmarks"
          body: |
            This PR updates the benchmarks.

            ## Overview
            ${{ steps.readme.outputs.BENCH_RESULTS }}
          branch: update-benchmarks
          base: main
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          reviewers: luxass
